function chipsFor(p, d) {
  const out = [];
  for (const l of leaveOn(p.id, d)) {
    if (l.kind === "holiday") out.push(`<span class="chip ${l.status === "approved" ? "hol" : "req"}">${l.status === "approved" ? "Holiday" : "Hol?"}</span>`);
    else if (l.kind === "rest") out.push(l.status === "approved" ? `<span class="chip rest">Day off</span>` : `<span class="chip reqrest">Off?</span>`);
    else out.push(`<span class="chip sick">${l.kind === "sick" ? "Sick" : "Off"}</span>`);
  }
  for (const s of S.shifts.filter((s) => s.person_id === p.id && s.day === d)) {
    const pl = place(s.place_id);
    if (pl) out.push(`<span class="chip ${placeClass(pl)}" title="${esc(pl.name)}">${esc(shortName(pl.name))}</span>`);
  }
  return out.join("");
}

function weekWarnings(days) {
  const warn = {};
  for (const d of days) {
    const list = [];
    if (closureOn(d)) { warn[d] = list; continue; }
    for (const pl of S.places.filter((x) => x.active && x.needs_cover)) {
      if (!S.shifts.some((s) => s.day === d && s.place_id === pl.id)) list.push(`<span class="chip gap">No one in ${esc(shortName(pl.name))}</span>`);
    }
    for (const p of activePeople()) {
      const off = leaveOn(p.id, d).some((l) => l.status === "approved");
      if (off && S.shifts.some((s) => s.person_id === p.id && s.day === d)) list.push(`<span class="chip clash">${esc(p.name)} is off</span>`);
    }
    warn[d] = list;
  }
  return warn;
}

function renderRota() {
  const days = [0, 1, 2, 3, 4, 5].map((i) => addDays(S.week, i));
  const end = days[5];
  const people = activePeople();
  const warn = weekWarnings(days);
  const admin = isAdmin();
  let html = `
    <div class="weeknav">
      <button id="prevWeek" aria-label="Previous week">‹</button>
      <div class="label"><span class="pickwrap">${fmt(S.week, { day: "numeric", month: "short" })} – ${fmt(end, { day: "numeric", month: "short", year: "numeric" })} ▾<input type="date" id="weekPick" class="pick" value="${S.week}" aria-label="Pick a week"></span>
        <small>${S.week === monday(TODAY) ? "This week" : `<a href="#" id="thisWeek">Back to this week</a>`}</small></div>
      <button id="nextWeek" aria-label="Next week">›</button>
    </div>`;

  if (S.me && !admin) html += myWeekCard(days);

  html += `<div class="scroll"><table class="rota"><thead><tr><th class="name">${admin ? "Tap a box to change it" : ""}</th>`;
  for (const d of days) html += `<th class="${d === TODAY ? "today" : ""}">${dayLabel(d)}</th>`;
  html += `</tr></thead><tbody>`;
  for (const p of people) {
    const short = closuresInWeek(S.week) > 0 && p.days_per_week > 0;
    const wd = workingDays(p, S.week);
    const booked = S.shifts.filter((x) => x.person_id === p.id && x.day >= S.week && x.day <= end).length;
    html += `<tr class="${S.me && p.id === S.me.id ? "me" : ""}"><td class="name">${esc(p.name)}${p.days_per_week ? `<small>${short ? `${wd} day${wd === 1 ? "" : "s"} this week` : `${num(p.days_per_week)} days`}</small>` : ""}${admin && short && booked > wd ? `<span class="chip clash">${booked} on</span>` : ""}</td>`;
    for (const d of days) {
      const c = closureOn(d);
      if (c) { html += `<td class="cell closed">${esc(c.name)}</td>`; continue; }
      html += `<td class="cell ${admin ? "edit" : ""}" data-p="${p.id}" data-d="${d}">${chipsFor(p, d)}</td>`;
    }
    html += `</tr>`;
  }
  if (admin) {
    html += `<tr class="cover"><td class="name muted">Checks</td>`;
    for (const d of days) html += `<td>${(warn[d] || []).join("") || (closureOn(d) ? "" : `<span class="muted">All covered</span>`)}</td>`;
    html += `</tr>`;
  }
  html += `</tbody></table></div>`;
  html += `<div class="legend muted">${S.places.filter((p) => p.active).map((pl) => `<span class="chip ${placeClass(pl)}">${esc(shortName(pl.name))}</span>${esc(pl.name)}`).join(" &nbsp; ")}
    &nbsp; <span class="chip rest">Day off</span> &nbsp; <span class="chip hol">Holiday</span> &nbsp; <span class="chip req">Hol?</span> waiting</div>`;
  if (admin) html += `<div class="row" style="margin-top:12px"><button class="btn ghost" id="copyWeek">Copy last week into empty boxes</button></div>`;
  $("app").innerHTML = html;

  $("prevWeek").onclick = async () => { S.week = addDays(S.week, -7); await loadWeek(); render(); };
  $("weekPick").onclick = (e) => { try { e.target.showPicker(); } catch {} };
  $("weekPick").onchange = (e) => { if (e.target.value) goToWeek(e.target.value); };
  $("nextWeek").onclick = async () => { S.week = addDays(S.week, 7); await loadWeek(); render(); };
  if ($("thisWeek")) $("thisWeek").onclick = async (e) => { e.preventDefault(); S.week = monday(TODAY); await loadWeek(); render(); };
  if (admin) {
    $("app").querySelectorAll("td.cell.edit").forEach((td) => (td.onclick = () => editCell(person(td.dataset.p), td.dataset.d)));
    $("copyWeek").onclick = copyLastWeek;
  }
}

function myWeekCard(days) {
  const items = days.map((d) => {
    const c = closureOn(d);
    const what = c ? `<span class="muted">${esc(c.name)}</span>` : chipsFor(S.me, d) || `<span class="muted">Off</span>`;
    return `<li><span class="d">${dayLabel(d)}</span><span>${what}</span></li>`;
  }).join("");
  return `<div class="card"><h2>My week</h2><ul class="list myweek">${items}</ul></div>`;
}

function editCell(p, d) {
  const current = S.shifts.filter((s) => s.person_id === p.id && s.day === d).map((s) => s.place_id);
  const off = leaveOn(p.id, d);
  const booked = off.find((l) => l.status === "approved" && (l.kind === "rest" || l.kind === "holiday"));
  const note = off.length ? `<div class="msg warn">${esc(p.name)} has ${off.map((l) => l.status === "approved" ? ({ holiday: "a holiday", rest: "their day off", sick: "sick leave" }[l.kind] ?? "time off") : "a holiday request waiting").join(" and ")} that day.</div>` : "";
  // One shop a day: tap where they are and it's saved. Day off and Holiday book it in the calendar too.
  openSheet(`
    <h2>${esc(p.name)} · ${dayLabel(d)}</h2>${note}
    <div class="choices">${S.places.filter((x) => x.active).map((pl) => `<button class="choice ${placeClass(pl)} ${current.includes(pl.id) ? "on" : ""}" data-place="${pl.id}">${esc(pl.name)}</button>`).join("")}
      <button class="choice off ${booked?.kind === "rest" ? "on" : ""}" data-book="rest">Day off</button>
      <button class="choice hol ${booked?.kind === "holiday" ? "on" : ""}" data-book="holiday">Holiday</button></div>
    <div class="row" style="margin-top:12px">${current.length || booked ? `<button class="btn danger" id="clearCell">Clear</button>` : ""}<span class="spacer"></span><button class="btn ghost" data-close>Cancel</button></div>`);
  const save = async (ids) => {
    try {
      if (booked) await unbookDay(p, d);
      await api.setCell(p.id, d, ids);
      closeSheet();
      if (booked) await refresh(p, d); else { await loadWeek(); render(); }
    } catch (e) { alert("Couldn't save: " + e.message); }
  };
  $("sheet").querySelectorAll("[data-place]").forEach((b) => (b.onclick = () => save([b.dataset.place])));
  $("sheet").querySelectorAll("[data-book]").forEach((b) => (b.onclick = () => { closeSheet(); setDay(p, d, b.dataset.book); }));
  if ($("clearCell")) $("clearCell").onclick = () => save([]);
}

async function copyLastWeek() {
  const prev = addDays(S.week, -7);
  const rows = [];
  // Weekly days off carry over to the same day, unless something's already booked or the shop's shut.
  const rests = [];
  for (const l of S.leave.filter((l) => l.kind === "rest" && l.status === "approved" && l.last_day >= prev && l.first_day < S.week)) {
    for (let d = l.first_day < prev ? prev : l.first_day; d <= l.last_day && d < S.week; d = addDays(d, 1)) {
      const day = addDays(d, 7);
      if (!person(l.person_id)?.active || !openDay(day) || leaveOn(l.person_id, day).length) continue;
      if (S.shifts.some((x) => x.person_id === l.person_id && x.day === day)) continue;
      rests.push({ person_id: l.person_id, day });
    }
  }
  for (const s of S.shifts.filter((s) => s.day >= prev && s.day < S.week)) {
    const day = addDays(s.day, 7);
    const p = person(s.person_id);
    if (!p?.active || closureOn(day)) continue;
    if (rests.some((r) => r.person_id === s.person_id && r.day === day)) continue;
    if (S.shifts.some((x) => x.person_id === s.person_id && x.day === day)) continue; // keep what's already there
    if (leaveOn(s.person_id, day).some((l) => l.status === "approved")) continue;
    rows.push({ person_id: s.person_id, day, place_id: s.place_id });
  }
  if (!rows.length && !rests.length) { alert("Nothing to copy: last week is empty, or every box this week is already filled."); return; }
  const what = [rows.length && `${rows.length} shift${rows.length === 1 ? "" : "s"}`, rests.length && `${rests.length} day${rests.length === 1 ? "" : "s"} off`].filter(Boolean).join(" and ");
  if (!confirm(`Copy ${what} from last week into the empty boxes? People on holiday are skipped.`)) return;
  try {
    await api.addShifts(rows);
    const now = new Date().toISOString();
    for (const r of rests) await api.addLeave({ person_id: r.person_id, first_day: r.day, last_day: r.day, days: 0, kind: "rest", status: "approved", decided_at: now, note: null });
    if (rests.length) { await reloadData(); for (const pid of new Set(rests.map((r) => r.person_id))) await recount(person(pid), [S.week]); }
    else await loadWeek();
    render();
  } catch (e) { alert("Couldn't copy: " + e.message); }
}

// ---- Calendar: days off and holidays, linked to the rota ------------------------------------------------
const KIND = { rest: ["Day off", "rest"], holiday: ["Holiday", "hol"], sick: ["Sick", "sick"] };
const addMonths = (m, n) => { const [y, mo] = m.split("-").map(Number); return iso(new Date(y, mo - 1 + n, 1)).slice(0, 7); };
const firstName = (p) => (p?.name ?? "?").split(" ")[0];
const chipClass = (l) => (l.kind === "holiday" ? (l.status === "approved" ? "hol" : "req") : l.kind === "rest" ? (l.status === "approved" ? "rest" : "reqrest") : "sick");

function renderCalendar() {
  const admin = isAdmin();
  const m = S.month;
  const start = monday(`${m}-01`);
  const end = addDays(monday(addDays(`${addMonths(m, 1)}-01`, -1)), 5);
  const B = S.booking;
  const bp = admin && B.personId ? person(B.personId) : null;
  let html = `<div class="weeknav"><button id="prevMonth" aria-label="Previous month">‹</button>
    <div class="label">${fmt(m + "-01", { month: "long", year: "numeric" })}<small>${m === TODAY.slice(0, 7) ? "This month" : `<a href="#" id="thisMonth">Back to this month</a>`}</small></div>
    <button id="nextMonth" aria-label="Next month">›</button></div>`;

  if (admin) {
    let hint = "Pick someone, then tap days to book them off. Tap a day again to clear it. It goes straight onto the rota.";
    if (bp) {
      const a = bp.tracks_holiday ? allowance(bp, Number(m.slice(0, 4))) : null;
      hint = B.kind === "rest" ? `Tap days to give ${esc(bp.name)} their day off. Tap again to clear.`
        : B.start ? `${B.kind === "holiday" ? "Holiday" : "Sick"} from <b>${dayLabel(B.start)}</b>. Now tap the last day (the same day again for just one). <a href="#" id="cancelStart">Cancel</a>`
        : `Tap the first day of ${esc(bp.name)}'s ${B.kind === "holiday" ? "holiday" : "sickness"}, then the last day. Tap a day that's already booked to clear it.`;
      if (a) hint += ` <b>${num(a.left)}</b> holiday days left in ${m.slice(0, 4)}.`;
    }
    html += `<div class="card"><select id="bkWho"><option value="">Just looking: tap a day to see who's off</option>${activePeople().filter((p) => p.days_per_week > 0 || p.tracks_holiday || p.is_admin).map((p) => `<option value="${p.id}" ${p.id === B.personId ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select>
      ${bp ? `<div class="seg">${Object.entries(KIND).map(([k, [label, cls]]) => `<button class="${cls} ${B.kind === k ? "on" : ""}" data-kind="${k}">${label}</button>`).join("")}</div>` : ""}
      <p class="muted small" style="margin:8px 0 0">${hint}</p></div>`;
  } else if (S.me) {
    const A = S.ask;
    const a = S.me.tracks_holiday ? allowance(S.me, Number(m.slice(0, 4))) : null;
    let hint = !A.kind ? "Pick Day off or Holiday, then tap the days on the calendar. Your manager gets the request."
      : A.kind === "rest" ? "Tap the day you'd like off."
      : A.start ? `Holiday from <b>${dayLabel(A.start)}</b>. Now tap the last day (the same day again for just one). <a href="#" id="cancelAsk">Cancel</a>`
      : "Tap the first day of your holiday, then the last day.";
    if (a && A.kind === "holiday") hint += ` <b>${num(a.left)}</b> holiday days left.`;
    html += `<div class="card"><b>Ask for time off</b>
      <div class="seg">${[["rest", "Day off", "rest"], ["holiday", "Holiday", "hol"]].map(([k, label, cls]) => `<button class="${cls} ${A.kind === k ? "on" : ""}" data-ask="${k}">${label}</button>`).join("")}</div>
      <p class="muted small" style="margin:8px 0 0">${hint}</p></div>`;
  }

  html += `<div class="cal">${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map((d) => `<div class="hd">${d}</div>`).join("")}`;
  for (let wk = start; wk <= end; wk = addDays(wk, 7)) {
    for (let i = 0; i < 6; i++) {
      const d = addDays(wk, i);
      const c = closureOn(d);
      const cls = ["day", d.startsWith(m) ? "" : "out", d === TODAY ? "today" : "", c ? "closed" : "", (bp && d === B.start) || (!admin && d === S.ask.start) ? "start" : ""].join(" ");
      let inner = `<div class="n">${Number(d.slice(8))}</div>`;
      if (c) inner += `<div class="cl">${esc(c.name)}</div>`;
      else {
        const off = S.leave.filter((l) => counts(l) && l.first_day <= d && l.last_day >= d && person(l.person_id)?.active)
          .sort((a, b) => (person(a.person_id).sort - person(b.person_id).sort) || person(a.person_id).name.localeCompare(person(b.person_id).name));
        inner += off.map((l) => `<span class="chip ${chipClass(l)} ${bp && l.person_id !== bp.id ? "dim" : ""}" title="${esc(person(l.person_id).name)}: ${KIND[l.kind]?.[0] ?? "Off"}">${esc(firstName(person(l.person_id)))}</span>`).join("");
      }
      html += `<div class="${cls}" data-day="${d}">${inner}</div>`;
    }
  }
  html += `</div><div class="legend muted"><span class="chip rest">Name</span> day off &nbsp; <span class="chip hol">Name</span> holiday &nbsp; <span class="chip req">Name</span> holiday asked for${admin ? ` &nbsp; <span class="chip sick">Name</span> sick or other` : ""}</div>`;
  $("app").innerHTML = html;

  $("prevMonth").onclick = () => { S.month = addMonths(S.month, -1); render(); };
  $("nextMonth").onclick = () => { S.month = addMonths(S.month, 1); render(); };
  if ($("thisMonth")) $("thisMonth").onclick = (e) => { e.preventDefault(); S.month = TODAY.slice(0, 7); render(); };
  if ($("bkWho")) $("bkWho").onchange = () => { B.personId = $("bkWho").value; B.start = null; render(); };
  $("app").querySelectorAll("[data-kind]").forEach((b) => (b.onclick = () => { B.kind = b.dataset.kind; B.start = null; render(); }));
  if ($("cancelStart")) $("cancelStart").onclick = (e) => { e.preventDefault(); B.start = null; render(); };
  if ($("cancelAsk")) $("cancelAsk").onclick = (e) => { e.preventDefault(); S.ask.start = null; render(); };
  $("app").querySelectorAll("[data-ask]").forEach((b) => (b.onclick = () => { S.ask.kind = S.ask.kind === b.dataset.ask ? null : b.dataset.ask; S.ask.start = null; render(); }));
  $("app").querySelectorAll(".cal .day").forEach((cell) => (cell.onclick = () => {
    const d = cell.dataset.day;
    if (closureOn(d)) return;
    if (!admin && S.ask.kind) return askDay(d);
    if (!bp) return daySheet(d);
    if (S.saving) return;
    const has = S.leave.find((l) => l.person_id === bp.id && counts(l) && l.first_day <= d && l.last_day >= d);
    // Day off: one tap. Holiday and sick: tap the first day, then the last.
    if (B.kind === "rest" || (!B.start && has?.kind === B.kind)) {
      cell.classList.add("busy");
      return setDay(bp, d, has?.kind === B.kind ? null : B.kind);
    }
    if (!B.start) { B.start = d; return render(); }
    const [f, l] = B.start <= d ? [B.start, d] : [d, B.start];
    B.start = null;
    render();
    rangeSheet(bp, f, l, B.kind);
  }));
}

/** Who's off on one day, with the manager's buttons to clear a day or book someone. */
function daySheet(d) {
  const admin = isAdmin();
  const off = S.leave.filter((l) => counts(l) && l.first_day <= d && l.last_day >= d && person(l.person_id)?.active);
  const items = off.map((l) => `<li class="row"><b>${esc(person(l.person_id).name)}</b><span class="chip ${chipClass(l)}">${l.status === "requested" ? "Holiday asked for" : KIND[l.kind]?.[0] ?? "Off"}</span>
    ${l.first_day !== l.last_day ? `<span class="muted small">${dayLabel(l.first_day)} – ${dayLabel(l.last_day)}</span>` : ""}<span class="spacer"></span>
    ${admin && l.status === "approved" ? `<button class="btn danger" data-clear="${l.person_id}">Clear this day</button>` : ""}</li>`).join("");
  openSheet(`<h2>${fmt(d, { weekday: "long", day: "numeric", month: "long" })}</h2>
    ${items ? `<ul class="list">${items}</ul>` : `<p class="muted">Nobody's off.</p>`}
    ${admin ? `<label>Book someone off</label><select id="dsWho">${activePeople().filter((p) => (p.days_per_week > 0 || p.tracks_holiday || p.is_admin) && !off.some((l) => l.person_id === p.id)).map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select>
      <div class="seg">${Object.entries(KIND).map(([k, [label, cls]]) => `<button class="${cls}" data-dsbook="${k}">${label}</button>`).join("")}</div>` : ""}
    <div class="row" style="margin-top:12px"><button class="btn ghost" id="dsWeek">See this week's rota</button><span class="spacer"></span><button class="btn ghost" data-close>Close</button></div>`);
  $("dsWeek").onclick = () => goToWeek(d);
  $("sheet").querySelectorAll("[data-clear]").forEach((b) => (b.onclick = () => { closeSheet(); setDay(person(b.dataset.clear), d, null); }));
  $("sheet").querySelectorAll("[data-dsbook]").forEach((b) => (b.onclick = () => {
    const p = person($("dsWho").value), k = b.dataset.dsbook;
    if (!p) return;
    closeSheet();
    if (k === "rest") setDay(p, d, k); else rangeSheet(p, d, d, k);
  }));
}

/** Confirms a holiday or sickness from first to last day, with the holiday it uses. */
function rangeSheet(p, first, last, kind) {
  const label = kind === "holiday" ? "Holiday" : "Sick";
  openSheet(`<h2>${esc(p.name)}: ${label.toLowerCase()}</h2>
    <div class="grid2"><div><label>First day</label><input type="date" id="rgFirst" value="${first}"></div><div><label>Last day</label><input type="date" id="rgLast" value="${last}"></div></div>
    <p class="small" id="rgHelp"></p>
    <div class="msg bad" id="rgErr" hidden></div>
    <div class="row" style="margin-top:12px"><span class="spacer"></span><button class="btn ghost" data-close>Cancel</button><button class="btn" id="rgSave">Book ${label.toLowerCase()}</button></div>`);
  const upd = () => {
    const f = $("rgFirst").value, l = $("rgLast").value;
    if (!f || !l || l < f) { $("rgHelp").textContent = "The last day can't be before the first."; return; }
    const r = tidyRange(f, l);
    if (!r) { $("rgHelp").textContent = "Those days are all Sundays or closures."; return; }
    const others = S.leave.filter((x) => x.person_id === p.id && counts(x) && x.first_day <= r[1] && x.last_day >= r[0]);
    const kept = S.leave.filter((x) => !others.includes(x));
    let text = `${openDays(r[0], r[1]).length} open day${openDays(r[0], r[1]).length === 1 ? "" : "s"}, ${dayLabel(r[0])} to ${dayLabel(r[1])}. `;
    if (kind === "holiday" && p.tracks_holiday) {
      const n = holidayDays(p, { id: "new", person_id: p.id, kind, status: "approved", first_day: r[0], last_day: r[1] }, kept);
      text += `Uses <b>${num(n)}</b> holiday day${n === 1 ? "" : "s"}${Number(p.days_per_week) >= 5 ? " (the first day off each week is their normal day off)" : ""}.`;
      if (p.tracks_holiday) {
        const yr = Number(r[0].slice(0, 4)), a = allowance(p, yr);
        const back = others.filter((x) => x.kind === "holiday").reduce((s, x) => s + Number(x.days), 0);
        text += ` ${num(a.left + back - n)} left in ${yr} after this.`;
      }
    } else if (kind !== "holiday") text += "Sickness doesn't use holiday.";
    if (others.length) text += ` <span class="muted">Replaces what's already booked on those days.</span>`;
    $("rgHelp").innerHTML = text + ` <span class="muted">Any shifts on those days come off the rota.</span>`;
  };
  $("rgFirst").oninput = () => { if ($("rgLast").value < $("rgFirst").value) $("rgLast").value = $("rgFirst").value; upd(); };
  $("rgLast").oninput = upd;
  upd();
  $("rgSave").onclick = async () => {
    const f = $("rgFirst").value, l = $("rgLast").value;
    if (!f || !l || l < f || !tidyRange(f, l)) { $("rgErr").hidden = false; $("rgErr").textContent = "Check the dates."; return; }
    closeSheet();
    S.saving = true;
    try { await bookRange(p, f, l, kind); }
    catch (e) { alert("Couldn't save: " + e.message); await reload(); }
    finally { S.saving = false; }
  };
}
/** Books first–last as one entry: clears what overlaps, joins a same-kind booking either side, empties the rota. */
async function bookRange(p, first, last, kind) {
  [first, last] = tidyRange(first, last);
  for (const x of S.leave.filter((x) => x.person_id === p.id && counts(x) && x.first_day <= last && x.last_day >= first)) {
    const left = tidyRange(x.first_day, addDays(first, -1)), right = tidyRange(addDays(last, 1), x.last_day);
    if (!left && !right) { await api.deleteLeave(x.id); continue; }
    const keep = left ?? right;
    await api.updateLeave(x.id, { first_day: keep[0], last_day: keep[1] });
    if (left && right) await api.addLeave({ person_id: x.person_id, first_day: right[0], last_day: right[1], days: 0, kind: x.kind, status: x.status, decided_at: x.decided_at, note: x.note });
  }
  await reloadData();
  const same = S.leave.filter((x) => x.person_id === p.id && x.kind === kind && x.status === "approved");
  const before = same.find((x) => x.last_day >= prevOpen(first) && x.last_day < first);
  const after = same.find((x) => x.first_day > last && x.first_day <= nextOpen(last));
  if (before && after) { await api.updateLeave(before.id, { last_day: after.last_day }); await api.deleteLeave(after.id); }
  else if (before) await api.updateLeave(before.id, { last_day: last });
  else if (after) await api.updateLeave(after.id, { first_day: first });
  else await api.addLeave({ person_id: p.id, first_day: first, last_day: last, days: 0, kind, status: "approved", decided_at: new Date().toISOString(), note: null });
  await api.clearShifts(p.id, first, last);
  await reloadData();
  const mons = [];
  for (let m = monday(first); m <= last; m = addDays(m, 7)) mons.push(m);
  await recount(person(p.id), mons);
  render();
}

// ---- Booking single days (calendar and rota) ------------------------------------------------------------
const nextOpen = (d) => { for (let i = 0; i < 30; i++) { d = addDays(d, 1); if (openDay(d)) break; } return d; };
const prevOpen = (d) => { for (let i = 0; i < 30; i++) { d = addDays(d, -1); if (openDay(d)) break; } return d; };
/** A range trimmed to open days at each end, or null if none are left. */
function tidyRange(first, last) {
  while (first <= last && !openDay(first)) first = addDays(first, 1);
  while (last >= first && !openDay(last)) last = addDays(last, -1);
  return first <= last ? [first, last] : null;
}
/** Takes one day out of whatever booking covers it: shortens it, splits it, or removes it. */
async function unbookDay(p, d) {
  const cur = S.leave.find((l) => l.person_id === p.id && counts(l) && l.first_day <= d && l.last_day >= d);
  if (!cur) return;
  const left = tidyRange(cur.first_day, addDays(d, -1)), right = tidyRange(addDays(d, 1), cur.last_day);
  if (!left && !right) return api.deleteLeave(cur.id);
  const keep = left ?? right;
  await api.updateLeave(cur.id, { first_day: keep[0], last_day: keep[1] });
  if (left && right) await api.addLeave({ person_id: cur.person_id, first_day: right[0], last_day: right[1], days: 0, kind: cur.kind, status: cur.status, decided_at: cur.decided_at, note: cur.note });
}
/** Books one day, joining it onto a booking of the same kind either side so a week off stays one entry. */
async function bookDay(p, d, kind) {
  const cur = S.leave.find((l) => l.person_id === p.id && counts(l) && l.first_day <= d && l.last_day >= d);
  if (cur?.kind === kind) return;
  if (cur) await unbookDay(p, d);
  const same = S.leave.filter((l) => l !== cur && l.person_id === p.id && l.kind === kind && l.status === "approved");
  const before = same.find((l) => l.last_day >= prevOpen(d) && l.last_day < d);
  const after = same.find((l) => l.first_day > d && l.first_day <= nextOpen(d));
  if (before && after) { await api.updateLeave(before.id, { last_day: after.last_day }); await api.deleteLeave(after.id); }
  else if (before) await api.updateLeave(before.id, { last_day: d });
  else if (after) await api.updateLeave(after.id, { first_day: d });
  else await api.addLeave({ person_id: p.id, first_day: d, last_day: d, days: 0, kind, status: "approved", decided_at: new Date().toISOString(), note: null });
}
/** Books (or with kind null, clears) one day off and takes them off the rota that day. */
async function setDay(p, d, kind) {
  S.saving = true;
  try {
    if (kind) { await bookDay(p, d, kind); await api.clearShifts(p.id, d, d); }
    else await unbookDay(p, d);
    await refresh(p, d);
  } catch (e) { alert("Couldn't save: " + e.message); await reload(); }
  finally { S.saving = false; }
}
/** Holiday counts follow the week's days off, so recount that person's bookings in the week. */
async function recount(p, mons) {
  if (!p) return;
  const hit = S.leave.filter((l) => l.person_id === p.id && l.kind === "holiday" && counts(l) && mons.some((m) => l.first_day <= addDays(m, 5) && l.last_day >= m));
  for (const l of hit) { const n = holidayDays(p, l); if (n !== Number(l.days)) { await api.updateLeave(l.id, { days: n }); l.days = n; } }
}
/** Shows the rota for the week that day falls in. */
async function goToWeek(d) {
  closeSheet();
  S.tab = "rota";
  S.week = monday(d);
  await loadWeek();
  render();
  window.scrollTo(0, 0);
}
async function reloadData() { const session = await api.session(); await loadAll(session?.user?.id); }
async function refresh(p, d) { await reloadData(); await recount(person(p.id), [monday(d)]); render(); }

// ---- Holidays -------------------------------------------------------------------------------------------
function renderHolidays() {
  const y = S.year;
  let html = `<div class="weeknav"><button id="prevYear" aria-label="Previous year">‹</button><div class="label">${y}<small>Holiday year January – December</small></div><button id="nextYear" aria-label="Next year">›</button></div>`;
  const admin = isAdmin();

  if (S.me?.tracks_holiday) {
    const a = allowance(S.me, y);
    html += `<div class="card"><h2>My holiday</h2>
      <div class="stats"><div><b>${num(a.left)}</b>left to book</div><div><b>${num(a.used)}</b>booked</div><div><b>${num(a.waiting)}</b>waiting</div></div>
      <p class="muted small">You choose ${num(a.base)} days a year${a.extra ? `, plus ${a.extras.map((e) => `${num(e.days)} ${esc(e.reason.toLowerCase())}`).join(" and ")} this year` : ""}. Bank holidays and the Christmas closure are given on top.</p>
      <button class="btn" id="askOff">Ask for time off</button></div>`;
    const mine = S.leave.filter((l) => l.person_id === S.me.id && !(l.kind === "rest" && l.status === "approved" && l.last_day < TODAY) && l.first_day.startsWith(String(y))).sort((a, b) => b.first_day.localeCompare(a.first_day));
    html += `<div class="card"><h2>My requests</h2>${mine.length ? `<ul class="list">${mine.map((l) => leaveItem(l, { own: true })).join("")}</ul>` : `<p class="muted">None this year.</p>`}</div>`;
  }

  if (admin) {
    const waiting = S.leave.filter(needsDecision).sort((a, b) => a.first_day.localeCompare(b.first_day));
    html += `<div class="card"><h2>Waiting for you${waiting.length ? ` (${waiting.length})` : ""}</h2>${waiting.length ? `<ul class="list">${waiting.map((l) => leaveItem(l, { decide: true })).join("")}</ul>` : `<p class="muted">No requests waiting.</p>`}
      <button class="btn ghost" id="addOff">Add time off for someone</button></div>`;
    const yearExtras = S.extras.filter((e) => e.year === y);
    const extraItem = (e) => `<li class="row"><b>${esc(person(e.person_id)?.name)}</b><span>${num(e.days)} day${Number(e.days) === 1 ? "" : "s"}</span>
      <span class="muted small">${e.worked_on ? dayLabel(e.worked_on) + " · " : ""}${esc(e.reason)}</span><span class="spacer"></span><button class="btn danger" data-unextra="${e.id}">Remove</button></li>`;
    const holidayExtras = yearExtras.filter((e) => e.kind !== "overtime");
    const overtime = yearExtras.filter((e) => e.kind === "overtime").sort((a, b) => (a.worked_on || "").localeCompare(b.worked_on || ""));
    const months = [...new Set(overtime.map((e) => (e.worked_on || `${y}-01-01`).slice(0, 7)))];
    html += `<div class="card"><div class="row"><h2 style="margin:0">Extra days & overtime in ${y}</h2><span class="spacer"></span><button class="btn ghost" id="addExtra">Add</button></div>
      <h3>Added to holiday</h3>
      ${holidayExtras.length ? `<ul class="list">${holidayExtras.map(extraItem).join("")}</ul>` : `<p class="muted small">Days in lieu for extra days worked, holiday carried over from last year, or anything else agreed.</p>`}
      <h3>Overtime (paid)</h3>
      ${overtime.length ? months.map((m) => {
        const list = overtime.filter((e) => (e.worked_on || `${y}-01-01`).startsWith(m));
        const byPerson = [...new Set(list.map((e) => e.person_id))].map((pid) => `${esc(person(pid)?.name)} ${num(list.filter((e) => e.person_id === pid).reduce((s, e) => s + Number(e.days), 0))}`).join(" · ");
        return `<div class="small" style="margin-top:8px"><b>${fmt(m + "-01", { month: "long" })}</b> <span class="muted">· ${byPerson}</span></div><ul class="list">${list.map(extraItem).join("")}</ul>`;
      }).join("") : `<p class="muted small">Extra days paid as overtime show here month by month, ready for wages.</p>`}</div>`;

    const rows = activePeople().filter((p) => p.tracks_holiday).map((p) => {
      const a = allowance(p, y);
      return `<tr><td>${esc(p.name)}<br><span class="muted small">${esc(p.employer)}</span></td><td class="num">${a.extra ? `${num(a.base)} <span class="muted">+ ${num(a.extra)}</span>` : num(a.chosen)}</td><td class="num">${num(a.used)}</td><td class="num">${num(a.waiting)}</td><td class="num"><b>${num(a.left)}</b></td>
        <td class="num ${a.short ? "" : "muted"}">${a.short ? `<span class="chip gap">${num(a.given)} of ${num(a.minimum)}</span>` : `${num(a.given)} ✓`}</td></tr>`;
    }).join("");
    const anyShort = activePeople().some((p) => p.tracks_holiday && allowance(p, y).short);
    const christmasSet = S.closures.some((c) => c.kind === "closure" && c.day.startsWith(`${y}-12`));
    html += `<div class="card"><h2>Everyone's holiday</h2><div class="scroll" style="background:none"><table class="simple"><thead><tr><th>Name</th><th class="num">Choose</th><th class="num">Booked</th><th class="num">Waiting</th><th class="num">Left</th><th class="num">Legal min.</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="muted small">"Legal min." adds chosen days to bank holidays and closures and checks it against the legal 5.6 weeks. A bank holiday takes a day off everyone's week: 5 days go to 4, 2 days go to 1.</p>
      ${!christmasSet ? `<div class="msg warn">Christmas ${y} closure dates aren't set yet, so the legal check will look short until they are (People tab).</div>` : anyShort ? `<div class="msg warn">Someone's below the legal minimum for ${y}. Adding a day or two to their chosen days, or to the Christmas closure, fixes it.</div>` : ""}</div>`;
  }

  // Who's off soon: everyone sees approved holidays; admins also see sickness and requests.
  const from = TODAY, to = addDays(TODAY, 90);
  const soon = S.leave.filter((l) => l.kind !== "rest" && l.last_day >= from && l.first_day <= to && (l.status === "approved" || (admin && l.status === "requested")))
    .sort((a, b) => a.first_day.localeCompare(b.first_day));
  html += `<div class="card"><h2>Who's off in the next 3 months</h2>${soon.length ? `<ul class="list">${soon.map((l) => leaveItem(l, {})).join("")}</ul>` : `<p class="muted">Nobody yet.</p>`}</div>`;
  if (!S.me?.tracks_holiday && !admin) html += `<p class="muted">Your holiday isn't tracked here.</p>`;
  $("app").innerHTML = html;

  $("prevYear").onclick = () => { S.year--; render(); };
  $("nextYear").onclick = () => { S.year++; render(); };
  if ($("askOff")) $("askOff").onclick = () => requestSheet(S.me, false);
  if ($("addOff")) $("addOff").onclick = () => requestSheet(null, true);
  if ($("addExtra")) $("addExtra").onclick = () => extraSheet(y);
  $("app").querySelectorAll("[data-unextra]").forEach((b) => (b.onclick = async () => {
    if (!confirm("Remove these extra days?")) return;
    try { await api.deleteExtra(b.dataset.unextra); await reload(); } catch (e) { alert(e.message); }
  }));
  $("app").querySelectorAll("[data-goweek]").forEach((a) => (a.onclick = (e) => { e.preventDefault(); goToWeek(a.dataset.goweek); }));
  $("app").querySelectorAll("[data-approve]").forEach((b) => (b.onclick = () => decide(b.dataset.approve, "approved")));
  $("app").querySelectorAll("[data-decline]").forEach((b) => (b.onclick = () => decide(b.dataset.decline, "declined")));
  $("app").querySelectorAll("[data-keep]").forEach((b) => (b.onclick = async () => {
    try { await api.updateLeave(b.dataset.keep, { cancel_asked_at: null, cancel_note: null }); await reload(); } catch (e) { alert(e.message); }
  }));
  $("app").querySelectorAll("[data-docancel]").forEach((b) => (b.onclick = async () => {
    const l = S.leave.find((x) => x.id === b.dataset.docancel);
    if (!confirm(`Cancel ${person(l.person_id)?.name}'s ${l.kind === "rest" ? "day off" : "holiday"} (${whenLabel(l)})? Put them back on the rota for those days afterwards.`)) return;
    try {
      await api.updateLeave(l.id, { status: "cancelled", decided_at: new Date().toISOString(), cancel_asked_at: null });
      await recountFor(l);
      await reload();
    } catch (e) { alert(e.message); }
  }));
  $("app").querySelectorAll("[data-withdraw]").forEach((b) => (b.onclick = async () => {
    try { await api.withdrawCancel(b.dataset.withdraw); await reload(); } catch (e) { alert(e.message); }
  }));
  $("app").querySelectorAll("[data-change]").forEach((b) => (b.onclick = () => {
    const l = S.leave.find((x) => x.id === b.dataset.change);
    requestSheet(S.me, false, { first: l.first_day, last: l.last_day, kind: l.kind, replaces: l.id });
  }));
  $("app").querySelectorAll("[data-askcancel]").forEach((b) => (b.onclick = () => {
    const l = S.leave.find((x) => x.id === b.dataset.askcancel);
    openSheet(`<h2>Ask to cancel</h2><p>Your ${l.kind === "rest" ? "day off" : "holiday"} on <b>${whenLabel(l)}</b> stays booked until the manager agrees.</p>
      <label>Reason (optional)</label><input id="acNote" maxlength="200" placeholder="e.g. plans changed">
      <div class="row" style="margin-top:12px"><span class="spacer"></span><button class="btn ghost" data-close>Back</button><button class="btn danger" id="acSend">Ask to cancel</button></div>`);
    $("acSend").onclick = async () => {
      try { $("acSend").disabled = true; await api.askCancel(l.id, $("acNote").value.trim()); closeSheet(); await reload(); }
      catch (e) { $("acSend").disabled = false; alert(e.message); }
    };
  }));
  $("app").querySelectorAll("[data-cancel]").forEach((b) => (b.onclick = async () => {
    if (!confirm("Cancel this request?")) return;
    try { await api.cancelLeave(b.dataset.cancel); await reload(); } catch (e) { alert(e.message); }
  }));
  $("app").querySelectorAll("[data-remove]").forEach((b) => (b.onclick = async () => {
    if (!confirm("Remove this time off completely?")) return;
    try { await api.deleteLeave(b.dataset.remove); await reload(); } catch (e) { alert(e.message); }
  }));
}

function extraSheet(y) {
  const people = activePeople().filter((p) => p.tracks_holiday || p.days_per_week > 0);
  openSheet(`<h2>Add extra days</h2>
    <label>Who</label><select id="exWho">${people.filter((p) => !p.is_admin || p.tracks_holiday).map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select>
    <label>What for</label><select id="exKind"><option value="worked">Worked an extra day</option><option value="carried_over">Holiday carried over from ${y - 1}</option><option value="other">Something else</option></select>
    <div id="exWorked">
      <label>Day worked</label><input type="date" id="exDate" value="${TODAY}">
      <label class="check"><input type="radio" name="exPay" value="overtime" checked> Paid as overtime</label>
      <label class="check"><input type="radio" name="exPay" value="in_lieu"> Day off in lieu (adds a day to their holiday)</label>
    </div>
    <label>Days</label><input type="number" id="exDays" step="0.5" value="1">
    <label>Note (optional)</label><input id="exNote" maxlength="120" placeholder="e.g. covered Hull">
    <p class="muted small" id="exHelp"></p>
    <div class="msg bad" id="exErr" hidden></div>
    <div class="row" style="margin-top:12px"><span class="spacer"></span><button class="btn ghost" data-close>Cancel</button><button class="btn" id="exSave">Add</button></div>`);
  const kind = () => ($("exKind").value === "worked" ? $("sheet").querySelector("input[name=exPay]:checked").value : $("exKind").value);
  const upd = () => {
    $("exWorked").hidden = $("exKind").value !== "worked";
    $("exHelp").textContent = { overtime: "A record for wages. Their holiday doesn't change.", in_lieu: "Adds these days to their holiday for the year of the day worked.",
      carried_over: `Adds to their ${y} holiday. Use a minus number to take days off.`, other: "Adds to their holiday. Use a minus number to take days off." }[kind()];
  };
  $("exKind").onchange = upd;
  $("sheet").querySelectorAll("input[name=exPay]").forEach((r) => (r.onchange = upd));
  upd();
  $("exSave").onclick = async () => {
    const err = (m) => { $("exErr").hidden = false; $("exErr").textContent = m; };
    const days = Number($("exDays").value);
    if (!days) return err("Enter how many days.");
    const k = kind();
    const worked = $("exKind").value === "worked";
    if (worked && !$("exDate").value) return err("Pick the day they worked.");
    if (worked && days < 0) return err("Days worked can't be a minus number.");
    const note = $("exNote").value.trim();
    const label = { overtime: "Overtime", in_lieu: "Day in lieu", carried_over: `Carried over from ${y - 1}`, other: "Other" }[k];
    const row = { person_id: $("exWho").value, year: worked ? Number($("exDate").value.slice(0, 4)) : y, days, kind: k,
      worked_on: worked ? $("exDate").value : null, reason: label + (note ? ` (${note})` : "") };
    try { $("exSave").disabled = true; await api.addExtra(row); closeSheet(); await reload(); }
    catch (e) { $("exSave").disabled = false; err(e.message); }
  };
}

function leaveItem(l, { own, decide }) {
  const p = person(l.person_id);
  const old = l.replaces ? S.leave.find((x) => x.id === l.replaces) : null;
  const kind = l.kind === "holiday" ? "" : l.kind === "rest" ? ` <span class="chip rest">Day off</span>` : l.kind === "sick" ? ` <span class="chip sick">Sick</span>` : ` <span class="chip sick">Other</span>`;
  const status = l.status === "approved" && l.cancel_asked_at ? `<span class="chip clash">Asked to cancel</span>`
    : { requested: `<span class="chip req">${l.replaces ? "Change waiting" : "Waiting"}</span>`, approved: `<span class="chip hol">Approved</span>`, declined: `<span class="chip gap">Declined</span>`, cancelled: `<span class="muted small">Cancelled</span>` }[l.status];
  let extra = "";
  if (old) extra += `<div class="small">Change of dates: instead of <b>${whenLabel(old)}</b>${old.status !== "approved" ? ` <span class="muted">(that one's now ${old.status})</span>` : ""}</div>`;
  if (l.cancel_asked_at && l.status === "approved") extra += `<div class="small">${own ? "You've asked" : `${esc(p?.name)} has asked`} to cancel this${l.cancel_note ? `: “${esc(l.cancel_note)}”` : "."}</div>`;
  if (decide && l.status === "approved" && l.cancel_asked_at) {
    extra += `<div class="row" style="margin-top:8px"><button class="btn ghost" data-keep="${l.id}">Keep it booked</button><span class="spacer"></span><button class="btn ok" data-docancel="${l.id}">Cancel it</button></div>`;
  } else if (decide) {
    const others = S.leave.filter((o) => o.id !== l.id && o.person_id !== l.person_id && (o.status === "approved" || o.status === "requested") && o.first_day <= l.last_day && o.last_day >= l.first_day);
    if (others.length) extra += `<div class="msg warn">Also off then: ${others.map((o) => `${esc(person(o.person_id)?.name)}${o.status === "requested" ? " (asked)" : ""}`).join(", ")}</div>`;
    const a = p ? allowance(p, Number(l.first_day.slice(0, 4))) : null;
    if (a && l.kind === "holiday") extra += `<div class="muted small">${esc(p.name)} has ${num(a.chosen - a.used + (old?.kind === "holiday" && old.status === "approved" ? Number(old.days) : 0))} days left before this.</div>`;
    extra += `<div class="row" style="margin-top:8px"><button class="btn danger" data-decline="${l.id}">Decline</button><span class="spacer"></span><button class="btn ok" data-approve="${l.id}">Approve${l.replaces ? " change" : ""}</button></div>`;
  } else if (own && l.status === "requested") {
    extra += `<div class="row" style="margin-top:6px"><button class="btn danger" data-cancel="${l.id}">${l.replaces ? "Never mind the change" : "Cancel request"}</button></div>`;
  } else if (own && l.status === "approved" && l.last_day >= TODAY && !isAdmin()) {
    const changing = S.leave.some((x) => x.replaces === l.id && x.status === "requested");
    extra += l.cancel_asked_at ? `<div class="row" style="margin-top:6px"><button class="btn ghost" data-withdraw="${l.id}">Never mind, keep it</button></div>`
      : changing ? `<div class="muted small">A change of dates is waiting for the manager.</div>`
      : `<div class="row" style="margin-top:6px"><button class="btn ghost" data-change="${l.id}">Change dates</button><button class="btn danger" data-askcancel="${l.id}">Ask to cancel</button></div>`;
  } else if (isAdmin() && !own && l.status === "approved") {
    extra += `<div class="row" style="margin-top:6px"><button class="btn danger" data-remove="${l.id}">Remove</button></div>`;
  }
  return `<li><div class="row"><b>${own ? "" : esc(p?.name) + " · "}<a href="#" class="goweek" data-goweek="${l.first_day}" title="See the rota for this week">${whenLabel(l)}</a></b>${kind}<span class="spacer"></span>${status}</div>
    <div class="muted small">${l.kind === "holiday" && l.days != null ? `${num(l.days)} holiday day${Number(l.days) === 1 ? "" : "s"}` : ""}${l.kind === "holiday" && l.days != null && l.note ? " · " : ""}${l.note ? esc(l.note) : ""}</div>${extra}</li>`;
}

/** Recounts holiday in the weeks these bookings touch. */
async function recountFor(...ls) {
  await reloadData();
  for (const l of ls.filter(Boolean)) {
    const mons = [];
    for (let m = monday(l.first_day); m <= l.last_day; m = addDays(m, 7)) mons.push(m);
    await recount(person(l.person_id), mons);
  }
}

async function decide(id, status) {
  const l = S.leave.find((x) => x.id === id);
  try {
    await api.updateLeave(id, { status, decided_at: new Date().toISOString() });
    const old = l?.replaces ? S.leave.find((x) => x.id === l.replaces) : null;
    if (l && status === "approved") {
      await api.clearShifts(l.person_id, l.first_day, l.last_day);
      if (old?.status === "approved") await api.updateLeave(old.id, { status: "cancelled", decided_at: new Date().toISOString(), cancel_asked_at: null, cancel_note: null });
    }
    if (l) await recountFor(l, old);
    await reload();
    if (status === "approved" && old) alert(`Done. ${person(l.person_id)?.name} is off ${whenLabel(l)} instead. Put them back on the rota for ${whenLabel(old)}.`);
  } catch (e) { alert("Couldn't save: " + e.message); }
}

/** Staff asking from the calendar: one tap for a day off, first and last day for a holiday. */
function askDay(d) {
  const A = S.ask;
  if (d < TODAY) return alert("Pick a day that's still to come. Ask the manager about days that have gone.");
  if (A.kind === "rest") return requestSheet(S.me, false, { first: d, last: d, kind: "rest" });
  if (!A.start) { A.start = d; return render(); }
  const [f, l] = A.start <= d ? [A.start, d] : [d, A.start];
  A.start = null;
  render();
  requestSheet(S.me, false, { first: f, last: l, kind: "holiday" });
}

function requestSheet(forPerson, asAdmin, pre = {}) {
  const people = activePeople().filter((p) => p.tracks_holiday || p.days_per_week > 0 || asAdmin);
  const first = pre.first ?? addDays(TODAY, 1), last = pre.last ?? first;
  let kind = pre.kind ?? "holiday", used = 0;
  // A change of dates replaces an approved booking: count without it, and give its days back.
  const old = pre.replaces ? S.leave.find((x) => x.id === pre.replaces) : null;
  const pool = old ? S.leave.filter((x) => x.id !== old.id) : S.leave;
  const back = old?.kind === "holiday" ? Number(old.days) : 0;
  const kinds = [["holiday", "Holiday"], ["rest", "Weekly day off"], ["sick", "Sick"], ["other", "Other time off"]];
  openSheet(`
    <h2>${asAdmin ? "Add time off" : pre.replaces ? "Change dates" : "Ask for time off"}</h2>
    ${pre.replaces ? `<p class="small muted" style="margin-top:0">Pick the new dates. What's booked now stays until the manager approves the change.</p>` : ""}
    ${asAdmin ? `<label>Who</label><select id="rqWho">${people.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select>
      <label>What</label><select id="rqKind">${kinds.map(([k, t]) => `<option value="${k}" ${k === kind ? "selected" : ""}>${t}</option>`).join("")}</select>`
      : `<div class="seg" style="margin-top:0"><button class="rest" data-rqkind="rest">Day off</button><button class="hol" data-rqkind="holiday">Holiday</button></div>`}
    <div class="grid2"><div><label>First day off</label><input type="date" id="rqFirst" value="${first}"></div><div><label>Last day off</label><input type="date" id="rqLast" value="${last}"></div></div>
    ${asAdmin ? `<label>Holiday days this uses</label><input type="number" id="rqDays" min="0" step="0.5">` : ""}
    <p class="small" id="rqHelp" style="margin:10px 0 0"></p>
    <label>Note (optional)</label><input id="rqNote" maxlength="200" placeholder="${asAdmin ? "" : "e.g. family wedding"}">
    <div class="msg bad" id="rqErr" hidden></div>
    <div class="row" style="margin-top:12px"><span class="spacer"></span><button class="btn ghost" data-close>Cancel</button><button class="btn" id="rqSend">${asAdmin ? "Add" : "Send request"}</button></div>`);
  const who = () => (asAdmin ? person($("rqWho").value) : forPerson);
  const update = () => {
    const f = $("rqFirst").value, l = $("rqLast").value, p = who();
    if (asAdmin) kind = $("rqKind").value;
    else $("sheet").querySelectorAll("[data-rqkind]").forEach((b) => b.classList.toggle("on", b.dataset.rqkind === kind));
    if (!f || !l || l < f) { $("rqHelp").textContent = "The last day can't be before the first."; return; }
    if (!openDays(f, l).length) { $("rqHelp").textContent = "Those days are all Sundays or closures."; return; }
    used = kind === "holiday" ? holidayDays(p, { id: "new", person_id: p.id, kind: "holiday", status: "requested", first_day: f, last_day: l }, pool) : 0;
    if (asAdmin) $("rqDays").value = used;
    const a = p.tracks_holiday ? allowance(p, Number(f.slice(0, 4))) : null;
    $("rqHelp").innerHTML = kind !== "holiday" ? (kind === "rest" ? "A day off doesn't use holiday." : "Doesn't use holiday.")
      : `Uses <b>${num(used)}</b> holiday day${used === 1 ? "" : "s"}${a ? ` · ${num(a.left + back - used)} left after this` : ""}`
        + (used === 0 && p.days_per_week >= 5 ? ` <span class="muted">(the first day off in a week is ${asAdmin ? "their" : "your"} weekly day off)</span>` : "");
  };
  ["rqFirst", "rqLast"].forEach((i) => ($(i).oninput = () => { if ($("rqLast").value < $("rqFirst").value) $("rqLast").value = $("rqFirst").value; update(); }));
  if (asAdmin) { $("rqWho").onchange = update; $("rqKind").onchange = update; }
  else $("sheet").querySelectorAll("[data-rqkind]").forEach((b) => (b.onclick = () => { kind = b.dataset.rqkind; update(); }));
  update();
  $("rqSend").onclick = async () => {
    const f = $("rqFirst").value, l = $("rqLast").value, p = who();
    const err = (m) => { $("rqErr").textContent = m; $("rqErr").hidden = false; };
    if (!f || !l || l < f) return err("Check the dates.");
    if (!openDays(f, l).length) return err("Those days are all Sundays or closures.");
    if (!asAdmin && f < TODAY) return err("Requests are for days still to come. Ask the manager to add past days.");
    const days = asAdmin ? Number($("rqDays").value) || 0 : used;
    const a = p.tracks_holiday ? allowance(p, Number(f.slice(0, 4))) : null;
    if (kind === "holiday" && !asAdmin && a && days > a.left + back) return err(`That's ${num(days)} days but there are only ${num(a.left + back)} left to book.`);
    if (old && f === old.first_day && l === old.last_day && kind === old.kind) return err("Those are the dates already booked.");
    const row = { person_id: p.id, first_day: f, last_day: l, days, kind, note: $("rqNote").value.trim() || null, status: asAdmin ? "approved" : "requested" };
    if (old) row.replaces = old.id;
    if (asAdmin) row.decided_at = new Date().toISOString();
    try {
      $("rqSend").disabled = true;
      await api.addLeave(row);
      if (asAdmin) await api.clearShifts(p.id, f, l); // they're off, so off the rota too
      closeSheet(); await reload();
    }
    catch (e) { $("rqSend").disabled = false; err("Couldn't send: " + e.message); }
  };
}

// ---- People, places and closures (admins) ------------------------------------------------------------------
function renderPeople() {
  const y = S.year;
  const loginOf = (p) => S.logins.find((l) => l.person_id === p.id)?.email;
  let html = `<div class="card"><div class="row"><h2 style="margin:0">People</h2><span class="spacer"></span><button class="btn ghost" id="addPerson">Add someone</button></div>
    <ul class="list">${S.people.map((p) => `<li class="row" data-person="${p.id}" style="cursor:pointer"><div><b>${esc(p.name)}</b>${p.is_admin ? ` <span class="chip p0">Manager</span>` : ""}${p.active ? "" : ` <span class="muted small">(left)</span>`}
      <div class="muted small">${esc(p.employer)} · ${num(p.days_per_week)} days a week${p.tracks_holiday ? ` · ${num(p.chosen_days)} days to choose` : " · holiday not tracked"}${p.home_place_id ? ` · ${esc(place(p.home_place_id)?.name)}` : ""}</div>
      <div class="small">${p.user_id ? `<span style="color:var(--ok)">Signed in ✓</span>` : loginOf(p) ? `<span class="muted">Login: ${esc(loginOf(p))} (not signed in yet)</span>` : `<span class="muted">No login yet</span>`}</div></div><span class="spacer"></span><span class="muted">›</span></li>`).join("")}</ul></div>`;

  html += `<div class="card"><h2>Places</h2>${S.places.map((pl) => `<label class="check"><input type="checkbox" data-cover="${pl.id}" ${pl.needs_cover ? "checked" : ""}> <span class="chip ${placeClass(pl)}">${esc(shortName(pl.name))}</span> ${esc(pl.name)} needs someone every open day</label>`).join("")}
    <p class="muted small">Ticked places show "No one in…" on the rota when a day's empty.</p></div>`;

  const yc = S.closures.filter((c) => c.day.startsWith(String(y)));
  html += `<div class="card"><div class="weeknav" style="margin:0 0 6px"><button id="prevYear" aria-label="Previous year">‹</button><div class="label">Days off for everyone in ${y}<small>Bank holidays and closures</small></div><button id="nextYear" aria-label="Next year">›</button></div>
    <ul class="list">${yc.map((c) => `<li class="row"><span>${dayLabel(c.day)}</span><span class="${c.kind === "bank" ? "muted" : ""}">${esc(c.name)}</span><span class="spacer"></span><button class="btn danger" data-unclose="${c.day}">Remove</button></li>`).join("") || `<li class="muted">None set for ${y}.</li>`}</ul>
    <div class="row" style="margin-top:10px"><button class="btn ghost" id="addXmas">Set Christmas closure</button><button class="btn ghost" id="addDay">Add a day</button></div></div>`;

  html += `<div class="card"><h2>Giving someone a login</h2><ol class="small" style="padding-left:18px;margin:0">
    <li>Tap their name above and enter their email under <b>Login email</b>.</li>
    <li>In Supabase, go to <b>Authentication → Users → Add user → Create new user</b>, with the same email and a starter password. Tick <b>Auto confirm</b>.</li>
    <li>Give them the starter password and this page's address. When they first sign in they're linked automatically, and they can change their password under <b>Account</b>.</li></ol></div>`;
  $("app").innerHTML = html;

  $("addPerson").onclick = () => personSheet(null);
  $("app").querySelectorAll("[data-person]").forEach((li) => (li.onclick = () => personSheet(person(li.dataset.person))));
  $("app").querySelectorAll("[data-cover]").forEach((cb) => (cb.onchange = async () => {
    const pl = place(cb.dataset.cover);
    try { await api.savePlace({ id: pl.id, needs_cover: cb.checked }); pl.needs_cover = cb.checked; } catch (e) { alert(e.message); cb.checked = !cb.checked; }
  }));
  $("prevYear").onclick = () => { S.year--; render(); };
  $("nextYear").onclick = () => { S.year++; render(); };
  $("app").querySelectorAll("[data-unclose]").forEach((b) => (b.onclick = async () => {
    if (!confirm("Remove this day off?")) return;
    try { await api.deleteClosure(b.dataset.unclose); await reload(); } catch (e) { alert(e.message); }
  }));
  $("addXmas").onclick = christmasSheet;
  $("addDay").onclick = () => {
    openSheet(`<h2>Add a day off for everyone</h2><label>Day</label><input type="date" id="cdDay" value="${S.year}-01-01">
      <label>Name</label><input id="cdName" placeholder="e.g. Extra bank holiday"><label>Type</label><select id="cdKind"><option value="bank">Bank holiday</option><option value="closure">Shop closure</option></select>
      <div class="row" style="margin-top:12px"><span class="spacer"></span><button class="btn ghost" data-close>Cancel</button><button class="btn" id="cdSave">Add</button></div>`);
    $("cdSave").onclick = async () => {
      const day = $("cdDay").value, name = $("cdName").value.trim() || ($("cdKind").value === "bank" ? "Bank holiday" : "Shop closure");
      if (!day) return;
      try { await api.addClosures([{ day, name, kind: $("cdKind").value }]); closeSheet(); await reload(); } catch (e) { alert(e.message); }
    };
  };
}

function christmasSheet() {
  const y = S.year;
  openSheet(`<h2>Christmas closure ${y}</h2>
    <div class="grid2"><div><label>Last day open</label><input type="date" id="xLast" value="${y}-12-23"></div><div><label>First day back</label><input type="date" id="xBack" value="${y + 1}-01-02"></div></div>
    <p class="muted small" id="xHelp"></p>
    <div class="row" style="margin-top:12px"><span class="spacer"></span><button class="btn ghost" data-close>Cancel</button><button class="btn" id="xSave">Save</button></div>`);
  const days = () => {
    const out = [];
    for (let d = addDays($("xLast").value, 1); d < $("xBack").value && out.length < 40; d = addDays(d, 1)) if (!isSunday(d) && closureOn(d)?.kind !== "bank") out.push(d);
    return out;
  };
  const upd = () => { const n = days().length; $("xHelp").textContent = `${n} closed shop day${n === 1 ? "" : "s"} on top of the bank holidays. Everyone gets these off without using holiday.`; };
  $("xLast").oninput = upd; $("xBack").oninput = upd; upd();
  $("xSave").onclick = async () => {
    try { await api.addClosures(days().map((day) => ({ day, name: "Christmas closure", kind: "closure" }))); closeSheet(); await reload(); }
    catch (e) { alert(e.message); }
  };
}

function personSheet(p) {
  const isNew = !p;
  p = p ?? { name: "", employer: "Fletchers Cobblers Ltd", days_per_week: 5, chosen_days: 15, tracks_holiday: true, home_place_id: null, is_admin: false, active: true, sort: S.people.length };
  const email = isNew ? "" : S.logins.find((l) => l.person_id === p.id)?.email ?? "";
  openSheet(`<h2>${isNew ? "Add someone" : esc(p.name)}</h2>
    <label>Name</label><input id="pName" value="${esc(p.name)}">
    <label>Employed by</label><input id="pEmployer" value="${esc(p.employer)}" list="employers">
    <datalist id="employers">${[...new Set(S.people.map((x) => x.employer))].map((e) => `<option value="${esc(e)}">`).join("")}</datalist>
    <div class="grid2"><div><label>Days a week</label><input type="number" id="pDays" min="0" max="6" step="0.5" value="${num(p.days_per_week)}"></div>
      <div><label>Holiday days to choose</label><input type="number" id="pChosen" min="0" step="0.5" value="${num(p.chosen_days)}"></div></div>
    <label>Usual shop</label><select id="pHome"><option value="">Moves around</option>${S.places.map((pl) => `<option value="${pl.id}" ${pl.id === p.home_place_id ? "selected" : ""}>${esc(pl.name)}</option>`).join("")}</select>
    <label>Login email</label><input id="pEmail" type="email" value="${esc(email)}" placeholder="Leave empty for no login">
    <label class="check"><input type="checkbox" id="pTrack" ${p.tracks_holiday ? "checked" : ""}> Track their holiday</label>
    <label class="check"><input type="checkbox" id="pAdmin" ${p.is_admin ? "checked" : ""}> Manager (builds rotas, approves holidays)</label>
    <label class="check"><input type="checkbox" id="pActive" ${p.active ? "checked" : ""}> Still works here</label>
    <div class="msg bad" id="pErr" hidden></div>
    <div class="row" style="margin-top:12px"><span class="spacer"></span><button class="btn ghost" data-close>Cancel</button><button class="btn" id="pSave">Save</button></div>`);
  $("pSave").onclick = async () => {
    const err = (m) => { $("pErr").textContent = m; $("pErr").hidden = false; };
    const row = {
      ...(isNew ? {} : { id: p.id }),
      name: $("pName").value.trim(), employer: $("pEmployer").value.trim() || "Fletchers Cobblers Ltd",
      days_per_week: Number($("pDays").value) || 0, chosen_days: Number($("pChosen").value) || 0,
      home_place_id: $("pHome").value || null, tracks_holiday: $("pTrack").checked, is_admin: $("pAdmin").checked,
      active: $("pActive").checked, sort: p.sort ?? 0,
    };
    if (!row.name) return err("Enter a name.");
    if (!isNew && p.id === S.me.id && (!row.is_admin || !row.active)) return err("You can't take away your own manager access here.");
    const mail = $("pEmail").value.trim().toLowerCase();
    if (mail && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) return err("That email doesn't look right.");
    try {
      $("pSave").disabled = true;
      const saved = await api.savePerson(row);
      if (mail !== email) await api.saveLogin(saved.id, mail || null);
      closeSheet(); await reload();
    } catch (e) { $("pSave").disabled = false; err("Couldn't save: " + e.message); }
  };
}

// ---- Notifications --------------------------------------------------------------------------------------------
const PUSH_URL = `${SUPABASE_URL}/functions/v1/push`;
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const unb64u = (t) => Uint8Array.from(atob(t.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - (t.length % 4)) % 4)), (c) => c.charCodeAt(0));
const pushWhat = () => (isAdmin() ? "someone asks for time off, or wants to change or cancel it" : "your time off is approved or declined, or your rota changes");
async function pushSubscription() {
  if (!pushSupported()) return null;
  const reg = await navigator.serviceWorker.getRegistration();
  return reg ? reg.pushManager.getSubscription() : null;
}
async function pushOn() {
  if (DEMO) throw new Error("Notifications don't work in the demo.");
  if ((await Notification.requestPermission()) !== "granted") throw new Error("Notifications are blocked for this page. Allow them in the browser's settings for this site, then try again.");
  const reg = await navigator.serviceWorker.register("sw.js");
  await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    const { key } = await (await fetch(`${PUSH_URL}/key`)).json();
    sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: unb64u(key) });
  }
  const j = sub.toJSON();
  await api.pushSubscribe(j.endpoint, j.keys.p256dh, j.keys.auth);
  S.pushOn = true;
}
async function pushOff() {
  const sub = await pushSubscription();
  if (sub) { try { await api.pushUnsubscribe(sub.endpoint); } catch {} await sub.unsubscribe(); }
  S.pushOn = false;
}
/** On load: is this phone set up, and is it linked to whoever's signed in now? */
async function pushCheck() {
  try {
    const sub = await pushSubscription();
    S.pushOn = !!sub && Notification.permission === "granted";
    if (S.pushOn && !DEMO) { const j = sub.toJSON(); await api.pushSubscribe(j.endpoint, j.keys.p256dh, j.keys.auth); }
  } catch { S.pushOn = false; }
}
function pushCard() {
  let asked = false;
  try { asked = localStorage.getItem("rotaPushAsked") === "1"; } catch {}
  if (!S.me || S.pushOn || asked || !pushSupported() || Notification.permission === "denied") return "";
  return `<div class="card row" id="pushCard"><div style="flex:1;min-width:200px"><b>Get notifications?</b><div class="muted small">This phone can tell you when ${pushWhat()}.</div></div>
    <button class="btn ghost" id="pushLater">Not now</button><button class="btn" id="pushYes">Turn on</button></div>`;
}
function wirePushCard() {
  if (!$("pushCard")) return;
  $("pushLater").onclick = () => { try { localStorage.setItem("rotaPushAsked", "1"); } catch {} $("pushCard").remove(); };
  $("pushYes").onclick = async () => {
    try { $("pushYes").disabled = true; await pushOn(); $("pushCard").remove(); await api.pushTest().catch(() => {}); }
    catch (e) { $("pushYes").disabled = false; alert(e.message); }
  };
}
function pushSection() {
  let state, buttons = "";
  if (!pushSupported()) state = /iPhone|iPad|iPod/.test(navigator.userAgent)
    ? "On an iPhone: tap Share, then <b>Add to Home Screen</b>. Open the Rota from the new icon and turn notifications on here."
    : "This browser can't do notifications. Try Chrome or Firefox.";
  else if (Notification.permission === "denied") state = "Blocked for this page. Allow notifications in the browser's settings for this site, then come back here.";
  else if (S.pushOn) { state = "<b>On</b> for this phone."; buttons = `<button class="btn ghost" id="pnTest">Send a test</button><button class="btn danger" id="pnOff">Turn off</button>`; }
  else { state = `Off. Turn on to hear when ${pushWhat()}.`; buttons = `<button class="btn" id="pnOn">Turn on</button>`; }
  return `<h3>Notifications</h3><p class="small" style="margin:0 0 8px">${state}</p><div class="row">${buttons}</div><div class="msg" id="pnMsg" hidden></div>`;
}
function wirePushSection() {
  const say = (text, good) => { const m = $("pnMsg"); m.hidden = false; m.className = "msg " + (good ? "good" : "bad"); m.textContent = text; };
  const redo = () => { $("pushBox").innerHTML = pushSection(); wirePushSection(); };
  if ($("pnOn")) $("pnOn").onclick = async () => {
    try { $("pnOn").disabled = true; await pushOn(); redo(); await api.pushTest(); say("Done. A test notification is on its way.", true); }
    catch (e) { redo(); say(e.message); }
  };
  if ($("pnOff")) $("pnOff").onclick = async () => { await pushOff(); redo(); };
  if ($("pnTest")) $("pnTest").onclick = async () => {
    try { $("pnTest").disabled = true; await api.pushTest(); say("Sent. It should pop up in a few seconds.", true); }
    catch (e) { say(e.message); } finally { if ($("pnTest")) $("pnTest").disabled = false; }
  };
}

/** Opens what a notification points at: #holidays, #calendar or #week=YYYY-MM-DD. */
function applyHash() {
  const h = location.hash;
  if (h === "#holidays" || h === "#calendar") S.tab = h.slice(1);
  else if (/^#week=\d{4}-\d{2}-\d{2}$/.test(h)) { S.tab = "rota"; S.week = monday(h.slice(6)); }
  else return false;
  history.replaceState(null, "", location.pathname + location.search);
  return true;
}
if ("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", async (e) => {
  if (!e.data?.go || !S.me) return;
  location.hash = new URL(e.data.go).hash;
  if (applyHash()) { await reloadData(); render(); }
});

// ---- Account ---------------------------------------------------------------------------------------------------
$("menuBtn").onclick = () => {
  openSheet(`<h2>${esc(S.me?.name ?? "Account")}</h2>
    <label>New password</label><input type="password" id="newPw" autocomplete="new-password" minlength="8" placeholder="At least 8 characters">
    <div class="msg" id="pwMsg" hidden></div>
    <div id="pushBox">${pushSection()}</div>
    <div class="row" style="margin-top:16px"><button class="btn danger" id="signOut">Sign out</button><span class="spacer"></span><button class="btn ghost" data-close>Close</button><button class="btn" id="pwSave">Change password</button></div>`);
  wirePushSection();
  $("signOut").onclick = async () => { await pushOff().catch(() => {}); await api.signOut(); location.reload(); };
  $("pwSave").onclick = async () => {
    const pw = $("newPw").value, m = $("pwMsg");
    m.hidden = false;
    if (pw.length < 8) { m.className = "msg bad"; m.textContent = "Use at least 8 characters."; return; }
    try { await api.setPassword(pw); m.className = "msg good"; m.textContent = "Password changed."; $("newPw").value = ""; }
    catch (e) { m.className = "msg bad"; m.textContent = e.message; }
  };
};

// ---- Sheets ------------------------------------------------------------------------------------------------------
function openSheet(html) {
  $("sheet").innerHTML = html;
  $("modal").hidden = false;
  $("sheet").querySelectorAll("[data-close]").forEach((b) => (b.onclick = closeSheet));
}
function closeSheet() { $("modal").hidden = true; $("sheet").innerHTML = ""; }
$("modal").onclick = (e) => { if (e.target === $("modal")) closeSheet(); };

async function reload() {
  const session = await api.session();
  await loadAll(session?.user?.id);
  render();
}

// ---- Signing in ----------------------------------------------------------------------------------------------------
function showSignIn(message) {
  $("tabs").hidden = true; $("menuBtn").hidden = true; $("who").textContent = "";
  $("app").innerHTML = `<div class="card login"><h2>Sign in</h2>
    <label>Email</label><input type="email" id="email" autocomplete="username">
    <label>Password</label><input type="password" id="password" autocomplete="current-password">
    <div class="msg ${message ? "bad" : ""}" id="loginMsg" ${message ? "" : "hidden"}>${esc(message)}</div>
    <div class="row" style="margin-top:12px"><a href="#" id="forgot" class="small">Forgotten password?</a><span class="spacer"></span><button class="btn" id="signIn">Sign in</button></div></div>`;
  const go = async () => {
    try { await api.signIn($("email").value.trim(), $("password").value); await start(); }
    catch { const m = $("loginMsg"); m.hidden = false; m.className = "msg bad"; m.textContent = "That email and password weren't accepted."; }
  };
  $("signIn").onclick = go;
  $("password").onkeydown = (e) => { if (e.key === "Enter") go(); };
  $("forgot").onclick = async (e) => {
    e.preventDefault();
    const email = $("email").value.trim(), m = $("loginMsg");
    m.hidden = false;
    if (!email) { m.className = "msg bad"; m.textContent = "Type your email first, then tap Forgotten password."; return; }
    try { await api.resetPassword(email); m.className = "msg good"; m.textContent = "If that email has a login, a reset link is on its way."; }
    catch (err) { m.className = "msg bad"; m.textContent = err.message; }
  };
}

function showSetPassword() {
  $("tabs").hidden = true;
  $("app").innerHTML = `<div class="card login"><h2>Choose a new password</h2>
    <label>New password</label><input type="password" id="pw1" autocomplete="new-password" placeholder="At least 8 characters">
    <div class="msg bad" id="spMsg" hidden></div>
    <div class="row" style="margin-top:12px"><span class="spacer"></span><button class="btn" id="spSave">Save and continue</button></div></div>`;
  $("spSave").onclick = async () => {
    const pw = $("pw1").value;
    if (pw.length < 8) { $("spMsg").hidden = false; $("spMsg").textContent = "Use at least 8 characters."; return; }
    try { await api.setPassword(pw); history.replaceState(null, "", location.pathname); await start(); }
    catch (e) { $("spMsg").hidden = false; $("spMsg").textContent = e.message; }
  };
}

async function start() {
  try {
    const session = await api.session();
    if (!session) return showSignIn();
    await api.claim(); // links a first sign-in to its rota person by email
    applyHash();
    await loadAll(session.user.id);
    if (!S.me) {
      $("app").innerHTML = `<div class="card login"><h2>Not on the rota yet</h2><p>You're signed in as ${esc(session.user.email)}, but that email isn't linked to anyone on the rota. Ask the manager to add it under People.</p><button class="btn ghost" id="out">Sign out</button></div>`;
      $("out").onclick = async () => { await api.signOut(); location.reload(); };
      return;
    }
    await pushCheck();
    render();
  } catch (e) {
    $("app").innerHTML = `<div class="card"><h2>Couldn't load the rota</h2><p class="muted">${esc(e.message)}</p><button class="btn" onclick="location.reload()">Try again</button></div>`;
  }
}

if (!DEMO) {
  api.db.auth.onAuthStateChange((event) => { if (event === "PASSWORD_RECOVERY") showSetPassword(); });
}
if (!location.hash.includes("type=recovery")) start();
</script>
